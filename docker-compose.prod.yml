services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - source: build_database
          target: build_database
    image: underwood-payload
    container_name: underwood-payload
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3005}
      HOSTNAME: 0.0.0.0
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-https://underwood.by}
    volumes:
      - ./data:/app/data
      - ./media:/app/media
    labels:
      traefik.enable: 'true'
      traefik.docker.network: lignin
      traefik.http.routers.underwood.rule: Host(`underwood.by`)
      traefik.http.routers.underwood.entrypoints: websecure
      traefik.http.routers.underwood.tls: 'true'
      traefik.http.routers.underwood.service: underwood
      traefik.http.services.underwood.loadbalancer.server.port: '${PORT:-3005}'
      traefik.http.routers.underwood-http.rule: Host(`underwood.by`)
      traefik.http.routers.underwood-http.entrypoints: web
      traefik.http.routers.underwood-http.middlewares: underwood-https-redirect
      traefik.http.middlewares.underwood-https-redirect.redirectscheme.scheme: https
    networks:
      - lignin

secrets:
  build_database:
    file: ${BUILD_DATABASE_SECRET_PATH:-./.deploy/build-database.db.gz}

networks:
  lignin:
    external: true
