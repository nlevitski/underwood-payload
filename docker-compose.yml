services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        CMS_SEED_ADMIN_EMAIL: ${CMS_SEED_ADMIN_EMAIL}
        CMS_SEED_ADMIN_PASSWORD: ${CMS_SEED_ADMIN_PASSWORD}
    image: underwood-payload
    container_name: underwood-payload
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3005}
      HOSTNAME: 0.0.0.0
    ports:
      - '${PORT:-3005}:${PORT:-3005}'
    volumes:
      - ./data:/app/data
      - ./media:/app/media
