services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - source: build_database
          target: build_database
    image: underwood-payload
    container_name: underwood-payload
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3005}
      HOSTNAME: 0.0.0.0
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-https://underwood.by}
    ports:
      - '${PORT:-3005}:${PORT:-3005}'
    volumes:
      - ./data:/app/data
      - ./media:/app/media

secrets:
  build_database:
    file: ${BUILD_DATABASE_SECRET_PATH:-./.deploy/build-database.db.gz}
