name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_PATH: /home/${{ secrets.VPS_USER }}/underwood/underwood-payload

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Create deploy directories
        run: ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p '${DEPLOY_PATH}/data' '${DEPLOY_PATH}/media'"

      - name: Sync project files
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env' \
            --exclude 'data' \
            --exclude 'media' \
            --exclude 'coverage' \
            --exclude 'playwright-report' \
            --exclude 'test-results' \
            -e ssh \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${DEPLOY_PATH}/"

      - name: Verify Payload data on VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            set -e
            test -f '${DEPLOY_PATH}/data/underwood-payload.db' || {
              echo 'Missing ${DEPLOY_PATH}/data/underwood-payload.db'
              exit 1
            }
            test -d '${DEPLOY_PATH}/media' || {
              echo 'Missing ${DEPLOY_PATH}/media'
              exit 1
            }
            media_count=\$(find '${DEPLOY_PATH}/media' -maxdepth 1 -type f | wc -l)
            test \"\$media_count\" -gt 0 || {
              echo 'No media files found in ${DEPLOY_PATH}/media'
              exit 1
            }
          "

      - name: Deploy on VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            set -e
            cd '${DEPLOY_PATH}'
            bash scripts/prepare-docker-build-database.sh
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
          "
